name: Native Windows installation media test
on:
  push:
    branches: [test/windows-native-media]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WINDOWS_ISO_URL: https://go.microsoft.com/fwlink/?LinkId=2382600&clcid=0x409&culture=en-us&country=us
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf automake libtool autotools-dev patch pkg-config libgcrypt20-dev ntfs-3g
          echo "JAVA_HOME=${JAVA_HOME_17_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          df -h .
      - name: Run native filesystem regression tests
        run: scripts/test-native-ntfs.sh
      - name: Extract and verify the full official Windows ISO
        run: |
          test_dir="$PWD/app/build/native/host/tests"
          "$JAVA_HOME/bin/javac" -cp "$test_dir" -d "$test_dir"             app/src/main/java/pl/rufusportable/UdfTree.java             app/src/main/java/pl/rufusportable/ExtentInputStream.java             app/src/test/native/WindowsMediaTest.java
          "$JAVA_HOME/bin/java" -Xcheck:jni -Xmx512m -Djava.library.path="$test_dir"             -cp "$test_dir" pl.rufusportable.WindowsMediaTest "$WINDOWS_ISO_URL"             "$RUNNER_TEMP/windows-native.img" "$PWD/app/src/main/assets/rufus"
          df -h .
