name: Native Windows To Go boot and first logon
on:
  push:
    branches: [test/windows-to-go]
permissions:
  contents: read
jobs:
  wintogo:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WINDOWS_ISO_URL: https://go.microsoft.com/fwlink/?LinkId=2382600&clcid=0x409&culture=en-us&country=us
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Prepare isolated runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf automake libtool autotools-dev patch pkg-config libgcrypt20-dev ntfs-3g dosfstools qemu-system-x86 ovmf
          echo "JAVA_HOME=${JAVA_HOME_17_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          sudo chmod a+rw /dev/kvm
      - name: Build and test native engines
        run: |
          bash scripts/test-native-wim.sh
          bash scripts/test-native-hive.sh
          bash scripts/test-hive-reference.sh
      - name: Apply Windows and configure boot files
        run: |
          classes="$PWD/app/build/native/host/tests"
          "$JAVA_HOME/bin/javac" -cp "$classes:$PWD/app/build/native/host-hive" -d "$classes" \
            app/src/main/java/pl/rufusportable/UdfTree.java \
            app/src/main/java/pl/rufusportable/ExtentInputStream.java \
            app/src/main/java/pl/rufusportable/WindowsUnattend.java \
            app/src/main/java/pl/rufusportable/WimMetadata.java \
            app/src/main/java/pl/rufusportable/WindowsCustomization.java \
            app/src/main/java/pl/rufusportable/FatVolume.java \
            app/src/main/java/pl/rufusportable/RegistryHive.java \
            app/src/main/java/pl/rufusportable/WindowsToGoLayout.java \
            app/src/main/java/pl/rufusportable/WindowsBootConfiguration.java \
            app/src/main/java/pl/rufusportable/WindowsToGoBootFiles.java \
            app/src/main/java/pl/rufusportable/WindowsToGoInstaller.java \
            app/src/test/native/WindowsInstallProbe.java \
            app/src/test/native/WindowsMediaTest.java \
            app/src/test/native/WindowsToGoMediaTest.java
          "$JAVA_HOME/bin/java" -Xcheck:jni -Xmx512m \
            -Djava.library.path="$classes:$PWD/app/build/native/host-wim/tests:$PWD/app/build/native/host-hive" \
            -cp "$classes" pl.rufusportable.WindowsToGoMediaTest "$WINDOWS_ISO_URL" \
            "$RUNNER_TEMP/wintogo.img" "$RUNNER_TEMP/wintogo-source"
          df -h .
      - name: Boot Windows To Go and verify first logon
        run: |
          python3 scripts/test-windows-install.py "$RUNNER_TEMP/wintogo.img" \
            "$RUNNER_TEMP/internal.img" "$RUNNER_TEMP/wintogo-results" --wintogo --timeout 5400
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wintogo-results
          path: ${{ runner.temp }}/wintogo-results/
          if-no-files-found: ignore
          retention-days: 7
