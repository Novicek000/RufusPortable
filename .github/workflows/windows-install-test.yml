name: Full Windows installation on native Rufus media
on:
  push:
    branches: [test/windows-install]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WINDOWS_ISO_URL: https://go.microsoft.com/fwlink/?LinkId=2382600&clcid=0x409&culture=en-us&country=us
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: true
      - name: Prepare isolated VM runner
        run: |
          # These are preinstalled tools on this disposable runner, not user data.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get update
          sudo apt-get install -y gcc make autoconf automake libtool autotools-dev patch pkg-config libgcrypt20-dev ntfs-3g qemu-system-x86 ovmf
          echo "JAVA_HOME=${JAVA_HOME_17_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          sudo chmod a+rw /dev/kvm
          df -h .
      - name: Test and build native filesystems and answer generator
        run: |
          bash scripts/test-native-ntfs.sh
          bash scripts/test-native-wim.sh
      - name: Prepare and verify complete native Windows USB image
        run: |
          test_dir="$PWD/app/build/native/host/tests"
          "$JAVA_HOME/bin/javac" -cp "$test_dir" -d "$test_dir" \
            app/src/main/java/pl/rufusportable/UdfTree.java \
            app/src/main/java/pl/rufusportable/ExtentInputStream.java \
            app/src/main/java/pl/rufusportable/WindowsUnattend.java \
            app/src/main/java/pl/rufusportable/WimMetadata.java \
            app/src/main/java/pl/rufusportable/WindowsCustomization.java \
            app/src/test/native/WindowsInstallProbe.java \
            app/src/test/native/WindowsMediaTest.java
          "$JAVA_HOME/bin/java" -Xcheck:jni -Xmx512m \
            -Djava.library.path="$test_dir:$PWD/app/build/native/host-wim/tests" \
            -cp "$test_dir" pl.rufusportable.WindowsMediaTest "$WINDOWS_ISO_URL" \
            "$RUNNER_TEMP/windows-usb.img" "$PWD/app/src/main/assets/rufus" install
          df -h .
      - name: Install Windows and verify first logon
        run: |
          python3 scripts/test-windows-install.py "$RUNNER_TEMP/windows-usb.img" \
            "$RUNNER_TEMP/windows-target.img" "$RUNNER_TEMP/windows-install-results"
      - name: Upload installation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-install-results
          path: ${{ runner.temp }}/windows-install-results/
          if-no-files-found: ignore
          retention-days: 7
